[build-system]
requires = [
  "setuptools>=80",
  "setuptools-scm[simple]>=9.2",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "kittensynth"
dynamic = ["version"]
description = "KittenTTS synthesis frontend backed by kitteng2p and OnnxVoice"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "kittensynth contributors"}]
keywords = ["tts", "kitten", "kittentts", "onnx", "onnxruntime", "speech"]
dependencies = [
  "numpy>=1.23",
  "kitteng2p>=0.0,<0.2",
  "onnxvoice>=0.2,<0.3",
  "audiosig>=0.1.4,<0.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu]>=0.2,<0.3"]
gpu = ["onnxvoice[gpu]>=0.2,<0.3"]
bundled-g2p = ["kitteng2p[bundled]>=0.1,<0.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
  "twine>=5",
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/buchwandler/kittensynth"
Homepage = "https://github.com/buchwandler/kittensynth"

[project.scripts]
kittensynth = "kittensynth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kittensynth*"]

[tool.setuptools.package-data]
kittensynth = ["py.typed", "data/*.json"]

[tool.setuptools_scm]
fallback_version = "0.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: tests requiring real Kitten/OnnxVoice assets",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["kittensynth"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
