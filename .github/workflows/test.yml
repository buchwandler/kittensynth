name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model_verifier:
        description: Run calibrated verification with real managed models
        type: boolean
        required: true
        default: false
      run_managed_cold_path_integration:
        description: Run the managed model cold-cache download and offline-reuse integration test
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check kittensynth tests
      - run: python -m build

  public-api-py314:
    name: Public API (Python 3.14, no models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_public_api.py tests/test_identity.py tests/test_errors.py tests/test_discovery.py

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest
      - run: python -m ruff check kittensynth tests examples benchmarks tools docs
      - run: python -m mypy kittensynth
      - run: python -m compileall -q kittensynth tests examples benchmarks tools docs
      - run: python docs/make.py html
      - run: rm -rf dist && python -m build --sdist --wheel
      - run: python tools/check_release_artifacts.py dist
      - run: python -m twine check dist/*
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/kittensynth-wheel-smoke
          /tmp/kittensynth-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kittensynth-wheel-smoke/bin/python - <<'PY'
          from kittensynth.voice_level import default_voice_calibration

          catalog = default_voice_calibration()
          assert len(catalog.voices) == 32
          print(f"loaded {len(catalog.voices)} packaged calibration identities")
          PY
          /tmp/kittensynth-wheel-smoke/bin/python -m kittensynth --help | grep -E -- '--voice-level|--gain-db'

      - name: Smoke-test public API from installed wheel
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kittensynth-wheel-smoke/bin/python -m pip install pytest
          cp "$GITHUB_WORKSPACE/tests/test_public_api.py" /tmp/test_public_api.py
          cd /tmp
          /tmp/kittensynth-wheel-smoke/bin/python -m pytest /tmp/test_public_api.py

      - name: Smoke-test clean CPU extra wheel install
        shell: bash
        run: |
          set -euo pipefail
          wheels=( "$GITHUB_WORKSPACE"/dist/*.whl )
          python -m venv /tmp/kittensynth-wheel-cpu
          /tmp/kittensynth-wheel-cpu/bin/python -m pip install "${wheels[0]}[cpu,bundled-g2p]"
          /tmp/kittensynth-wheel-cpu/bin/python -m pip check
          /tmp/kittensynth-wheel-cpu/bin/python -c "import kittensynth, onnxvoice, onnxruntime, huggingface_hub"
      - name: Smoke-test clean GPU extra wheel install
        shell: bash
        run: |
          set -euo pipefail
          wheels=( "$GITHUB_WORKSPACE"/dist/*.whl )
          python -m venv /tmp/kittensynth-wheel-gpu
          /tmp/kittensynth-wheel-gpu/bin/python -m pip install "${wheels[0]}[gpu,bundled-g2p]"
          /tmp/kittensynth-wheel-gpu/bin/python -m pip check
          /tmp/kittensynth-wheel-gpu/bin/python -c "import kittensynth, onnxvoice, onnxruntime, huggingface_hub"
  managed-cold-path-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_managed_cold_path_integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[cpu,bundled-g2p]" pytest
      - name: Verify managed cold download and offline cache reuse
        env:
          KITTENSYNTH_RUN_MANAGED_INTEGRATION: "1"
          HF_HUB_DISABLE_XET: "1"
        run: python -m pytest -m integration tests/test_managed_dependencies.py
  real-model-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model_verifier
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[cpu,bundled-g2p]"
      - name: Run calibrated verifier
        id: verify
        continue-on-error: true
        run: |
          mkdir -p benchmarks/output/voice_level_calibration
          python benchmarks/verify_voice_calibration.py \
            --output benchmarks/output/voice_level_calibration/verification.json \
            2>&1 | tee benchmarks/output/voice_level_calibration/verifier.log
      - name: Upload verifier report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-verification-${{ github.run_id }}
          path: |
            benchmarks/output/voice_level_calibration/verification.json
            benchmarks/output/voice_level_calibration/verifier.log
          if-no-files-found: warn
      - name: Propagate verifier failure
        if: steps.verify.outcome == 'failure'
        run: exit 1
